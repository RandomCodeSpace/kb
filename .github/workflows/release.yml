name: Release

# Manually triggered release: validates the clean Go source, tags that exact
# commit, cross-compiles the binaries, and publishes the GitHub release.
# scripts/release.sh owns immutable publication. This workflow then verifies
# the published downloads and adds build provenance for those exact bytes.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (vX.Y.Z)'
        required: true
      notes:
        description: 'Release notes (markdown); empty uses docs/releases/<version>.md'
        required: false
        default: ''
      dry_run:
        description: 'Build and validate everything, publish nothing'
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local

jobs:
  dry-run:
    if: ${{ inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out repository without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0

      - name: Configure temporary tag identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Verify release locally
        env:
          VERSION: ${{ inputs.version }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          notes_file="docs/releases/$VERSION.md"
          if [ -n "$NOTES" ]; then
            printf '%s' "$NOTES" > "$RUNNER_TEMP/notes.md"
            notes_file="$RUNNER_TEMP/notes.md"
          fi
          bash scripts/release.sh "$VERSION" "$notes_file" --dry-run

  release:
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Cut release
        # Inputs reach the shell only through env, never by interpolation
        # into the script text.
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          notes_file="docs/releases/$VERSION.md"
          if [ -n "$NOTES" ]; then
            printf '%s' "$NOTES" > "$RUNNER_TEMP/notes.md"
            notes_file="$RUNNER_TEMP/notes.md"
          fi
          args=("$VERSION" "$notes_file")
          bash scripts/release.sh "${args[@]}"

      - name: Download and verify published release files
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          download_dir="$RUNNER_TEMP/release-downloads"
          mkdir "$download_dir"
          gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" --dir "$download_dir" \
            --pattern kb-linux-amd64 --pattern kb-linux-arm64 \
            --pattern kb-darwin-amd64 --pattern kb-darwin-arm64 \
            --pattern kb-windows-amd64.exe --pattern SHA256SUMS
          bash scripts/verify-release-artifacts.sh \
            "$VERSION" "$SOURCE_COMMIT" "$download_dir" --verify-only

      # Attestation failure fails the workflow. Published tags/assets remain
      # immutable; follow the next-patch recovery policy in scripts/release.sh.
      - name: Attest build provenance of the published downloads
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          create-storage-record: false
          subject-path: |
            ${{ runner.temp }}/release-downloads/kb-linux-amd64
            ${{ runner.temp }}/release-downloads/kb-linux-arm64
            ${{ runner.temp }}/release-downloads/kb-darwin-amd64
            ${{ runner.temp }}/release-downloads/kb-darwin-arm64
            ${{ runner.temp }}/release-downloads/kb-windows-amd64.exe
            ${{ runner.temp }}/release-downloads/SHA256SUMS

      - name: Verify every published attestation
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          for asset in "$RUNNER_TEMP/release-downloads/"*; do
            gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-digest "$SOURCE_COMMIT" --deny-self-hosted-runners
          done
