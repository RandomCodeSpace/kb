name: Sonar exact-revision gate

on:
  workflow_run:
    workflows: [Regression and candidate coverage]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: sonar-exact-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  validate-candidate:
    name: Validate candidate coverage and control plane
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact_id: ${{ steps.run.outputs.artifact_id }}
      run_id: ${{ steps.run.outputs.run_id }}
      run_attempt: ${{ steps.run.outputs.run_attempt }}
      job_id: ${{ steps.run.outputs.job_id }}
      event: ${{ steps.run.outputs.event }}
      mode: ${{ steps.run.outputs.mode }}
      candidate_repository: ${{ steps.run.outputs.candidate_repository }}
      candidate_sha: ${{ steps.run.outputs.candidate_sha }}
      candidate_tree: ${{ steps.run.outputs.candidate_tree }}
      candidate_ref: ${{ steps.run.outputs.candidate_ref }}
      workflow_ref: ${{ steps.run.outputs.workflow_ref }}
      workflow_sha: ${{ steps.run.outputs.workflow_sha }}
      test_revision_sha: ${{ steps.run.outputs.workflow_sha }}
      control_plane_sha: ${{ steps.control-plane.outputs.sha }}
      maintenance: ${{ steps.control-plane-change.outputs.maintenance }}
      security_base_sha: ${{ steps.control-plane-change.outputs.security_base_sha }}
      pull_request: ${{ steps.run.outputs.pull_request }}
      base_sha: ${{ steps.run.outputs.base_sha }}
      base_ref: ${{ steps.run.outputs.base_ref }}
    steps:
      - name: Check out protected default-branch control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted-main
          fetch-depth: 0
          persist-credentials: false

      - name: Pin protected control-plane identity
        id: control-plane
        env:
          EXPECTED_CONTROL_PLANE_SHA: ${{ github.workflow_sha }}
        run: |
          set -eu
          actual_sha=$(git -C trusted-main rev-parse HEAD)
          test "$actual_sha" = "$EXPECTED_CONTROL_PLANE_SHA"
          echo "sha=$actual_sha" >> "$GITHUB_OUTPUT"
          echo "Protected control-plane SHA: \`$actual_sha\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate triggering run, job, and artifact metadata
        id: run
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
          TRIGGER_WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          TRIGGER_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          TRIGGER_HEAD_REPOSITORY_ID: ${{ github.event.workflow_run.head_repository.id }}
          TRIGGER_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node trusted-main/scripts/ci/validate-workflow-run.cjs

      - name: Check out exact candidate without executing it
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.run.outputs.candidate_repository }}
          ref: ${{ steps.run.outputs.candidate_sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Classify protected control-plane changes
        id: control-plane-change
        env:
          BASE_SHA: ${{ steps.run.outputs.base_sha }}
          BASE_REF: ${{ steps.run.outputs.base_ref }}
          CANDIDATE_SHA: ${{ steps.run.outputs.candidate_sha }}
          ANALYSIS_MODE: ${{ steps.run.outputs.mode }}
        working-directory: candidate
        run: |
          set -eu
          if [ "$ANALYSIS_MODE" = pull_request ]; then
            bash ../trusted-main/scripts/ci/guard-control-plane.sh "$BASE_SHA" "$CANDIDATE_SHA" --classify >> "$GITHUB_OUTPUT"
            echo "security_base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          elif [ "$ANALYSIS_MODE" = branch ]; then
            git fetch --no-tags origin "$BASE_REF"
            guard_base=$(git merge-base "$CANDIDATE_SHA" "origin/$BASE_REF")
            bash ../trusted-main/scripts/ci/guard-control-plane.sh "$guard_base" "$CANDIDATE_SHA"
            echo 'maintenance=false' >> "$GITHUB_OUTPUT"
            echo "security_base_sha=$guard_base" >> "$GITHUB_OUTPUT"
          else
            echo 'maintenance=false' >> "$GITHUB_OUTPUT"
            echo "security_base_sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Reject unsafe candidate tree before environment release
        env:
          CANDIDATE_SHA: ${{ steps.run.outputs.candidate_sha }}
          CANDIDATE_TREE: ${{ steps.run.outputs.candidate_tree }}
        run: bash trusted-main/scripts/ci/validate-candidate-tree.sh candidate "$CANDIDATE_SHA" "$CANDIDATE_TREE"

      - name: Download and validate hostile artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.run.outputs.artifact_id }}
          RUN_ID: ${{ steps.run.outputs.run_id }}
          RUN_ATTEMPT: ${{ steps.run.outputs.run_attempt }}
          PRODUCER_EVENT: ${{ steps.run.outputs.event }}
          CANDIDATE_REPOSITORY: ${{ steps.run.outputs.candidate_repository }}
          CANDIDATE_SHA: ${{ steps.run.outputs.candidate_sha }}
          CANDIDATE_TREE: ${{ steps.run.outputs.candidate_tree }}
          CANDIDATE_REF: ${{ steps.run.outputs.candidate_ref }}
          WORKFLOW_REF: ${{ steps.run.outputs.workflow_ref }}
          WORKFLOW_SHA: ${{ steps.run.outputs.workflow_sha }}
          TEST_REVISION_SHA: ${{ steps.run.outputs.workflow_sha }}
          PULL_REQUEST: ${{ steps.run.outputs.pull_request }}
          BASE_SHA: ${{ steps.run.outputs.base_sha }}
          BASE_REF: ${{ steps.run.outputs.base_ref }}
          MAINTENANCE: ${{ steps.control-plane-change.outputs.maintenance }}
          SECURITY_BASE_SHA: ${{ steps.control-plane-change.outputs.security_base_sha }}
        run: |
          set -eu
          archive="$RUNNER_TEMP/candidate-coverage.zip"
          curl --fail --location --proto '=https' --tlsv1.2 \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            --output "$archive"
          python3 trusted-main/scripts/ci/validate-coverage-artifact.py \
            --archive "$archive" --output "$RUNNER_TEMP/validated-coverage" \
            --repository "$GITHUB_REPOSITORY" --workflow 'Regression and candidate coverage' \
            --workflow-ref "$WORKFLOW_REF" --workflow-sha "$WORKFLOW_SHA" \
            --test-revision-sha "$TEST_REVISION_SHA" \
            --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT" --event "$PRODUCER_EVENT" \
            --candidate-repository "$CANDIDATE_REPOSITORY" --candidate-sha "$CANDIDATE_SHA" \
            --candidate-tree "$CANDIDATE_TREE" --candidate-ref "$CANDIDATE_REF" \
            --pull-request "$PULL_REQUEST" --base-sha "$BASE_SHA" --base-ref "$BASE_REF" \
            --security-base-sha "$SECURITY_BASE_SHA" \
            --maintenance "$MAINTENANCE" \
            --repository-root "$GITHUB_WORKSPACE/candidate"

  scan:
    name: Protected exact-revision scan
    needs: validate-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: sonar-scan
    steps:
      - name: Check out exact clean candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.validate-candidate.outputs.candidate_repository }}
          ref: ${{ needs.validate-candidate.outputs.candidate_sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Check out protected scanner control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-candidate.outputs.control_plane_sha }}
          path: trusted-main
          fetch-depth: 1
          persist-credentials: false

      - name: Reassert protected control-plane identity after approval
        env:
          EXPECTED_CONTROL_PLANE_SHA: ${{ needs.validate-candidate.outputs.control_plane_sha }}
        run: |
          set -eu
          actual_sha=$(git -C trusted-main rev-parse HEAD)
          test "$actual_sha" = "$EXPECTED_CONTROL_PLANE_SHA"
          echo "Approved protected control-plane SHA: \`$actual_sha\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Reject unsafe candidate tree before tokened scan
        env:
          CANDIDATE_SHA: ${{ needs.validate-candidate.outputs.candidate_sha }}
          CANDIDATE_TREE: ${{ needs.validate-candidate.outputs.candidate_tree }}
        run: bash trusted-main/scripts/ci/validate-candidate-tree.sh candidate "$CANDIDATE_SHA" "$CANDIDATE_TREE"

      - name: Revalidate artifact and prepare coverage-only delta
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.validate-candidate.outputs.artifact_id }}
          RUN_ID: ${{ needs.validate-candidate.outputs.run_id }}
          RUN_ATTEMPT: ${{ needs.validate-candidate.outputs.run_attempt }}
          PRODUCER_EVENT: ${{ needs.validate-candidate.outputs.event }}
          CANDIDATE_REPOSITORY: ${{ needs.validate-candidate.outputs.candidate_repository }}
          CANDIDATE_SHA: ${{ needs.validate-candidate.outputs.candidate_sha }}
          CANDIDATE_TREE: ${{ needs.validate-candidate.outputs.candidate_tree }}
          CANDIDATE_REF: ${{ needs.validate-candidate.outputs.candidate_ref }}
          WORKFLOW_REF: ${{ needs.validate-candidate.outputs.workflow_ref }}
          WORKFLOW_SHA: ${{ needs.validate-candidate.outputs.workflow_sha }}
          TEST_REVISION_SHA: ${{ needs.validate-candidate.outputs.test_revision_sha }}
          PULL_REQUEST: ${{ needs.validate-candidate.outputs.pull_request }}
          BASE_SHA: ${{ needs.validate-candidate.outputs.base_sha }}
          BASE_REF: ${{ needs.validate-candidate.outputs.base_ref }}
          MAINTENANCE: ${{ needs.validate-candidate.outputs.maintenance }}
          SECURITY_BASE_SHA: ${{ needs.validate-candidate.outputs.security_base_sha }}
        run: |
          set -eu
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git -C candidate show -s --format=%T HEAD)" = "$CANDIDATE_TREE"
          test -z "$(git -C candidate status --porcelain=v1 --untracked-files=all)"
          if [ "$MAINTENANCE" = true ]; then
            cp --remove-destination trusted-main/sonar-project.properties candidate/sonar-project.properties
            test "$(stat -c '%a' candidate/sonar-project.properties)" = "$(stat -c '%a' trusted-main/sonar-project.properties)"
          else
            cmp candidate/sonar-project.properties trusted-main/sonar-project.properties
          fi
          sha256sum trusted-main/sonar-project.properties
          archive="$RUNNER_TEMP/candidate-coverage.zip"
          curl --fail --location --proto '=https' --tlsv1.2 \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            --output "$archive"
          python3 trusted-main/scripts/ci/validate-coverage-artifact.py \
            --archive "$archive" --output "$RUNNER_TEMP/validated-coverage" \
            --repository "$GITHUB_REPOSITORY" --workflow 'Regression and candidate coverage' \
            --workflow-ref "$WORKFLOW_REF" --workflow-sha "$WORKFLOW_SHA" \
            --test-revision-sha "$TEST_REVISION_SHA" \
            --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT" --event "$PRODUCER_EVENT" \
            --candidate-repository "$CANDIDATE_REPOSITORY" --candidate-sha "$CANDIDATE_SHA" \
            --candidate-tree "$CANDIDATE_TREE" --candidate-ref "$CANDIDATE_REF" \
            --pull-request "$PULL_REQUEST" --base-sha "$BASE_SHA" --base-ref "$BASE_REF" \
            --security-base-sha "$SECURITY_BASE_SHA" \
            --maintenance "$MAINTENANCE" \
            --repository-root "$GITHUB_WORKSPACE/candidate"
          mkdir candidate/coverage
          cp "$RUNNER_TEMP/validated-coverage/lcov.info" candidate/coverage/lcov.info
          cp "$RUNNER_TEMP/validated-coverage/go.out" candidate/coverage/go.out
          tracked_delta=$(git -C candidate diff --name-only)
          if [ "$MAINTENANCE" = true ]; then
            test -z "$tracked_delta" || test "$tracked_delta" = sonar-project.properties
            cmp candidate/sonar-project.properties trusted-main/sonar-project.properties
          else
            test -z "$tracked_delta"
          fi
          test -z "$(git -C candidate diff --cached --name-only)"
          test -z "$(git -C candidate status --porcelain=v1 --untracked-files=all | grep -v '^ M sonar-project.properties$' || true)"
          test "$(find candidate/coverage -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)" = "$(printf 'go.out\nlcov.info')"
          test "$(sha256sum candidate/coverage/lcov.info | cut -d ' ' -f 1)" = "$(sha256sum "$RUNNER_TEMP/validated-coverage/lcov.info" | cut -d ' ' -f 1)"
          test "$(sha256sum candidate/coverage/go.out | cut -d ' ' -f 1)" = "$(sha256sum "$RUNNER_TEMP/validated-coverage/go.out" | cut -d ' ' -f 1)"

      - name: Validate protected Sonar variables
        env:
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          test -n "$SONAR_ORGANIZATION"
          test -n "$SONAR_PROJECT_KEY"

      - name: Scan and verify exact Sonar revision
        uses: ./trusted-main/.github/actions/protected-sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          project-base-dir: ${{ github.workspace }}/candidate
          organization: ${{ vars.SONAR_ORGANIZATION }}
          project-key: ${{ vars.SONAR_PROJECT_KEY }}
          candidate-sha: ${{ needs.validate-candidate.outputs.candidate_sha }}
          analysis-mode: ${{ needs.validate-candidate.outputs.mode }}
          pull-request: ${{ needs.validate-candidate.outputs.pull_request }}
          candidate-ref: ${{ needs.validate-candidate.outputs.candidate_ref }}
          base-ref: ${{ needs.validate-candidate.outputs.base_ref }}
