<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">kb terminal board</title>
  <desc id="desc">A dark terminal window showing Todo, Doing, and Done columns with project-scoped task cards.</desc>
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111722"/>
      <stop offset="1" stop-color="#0b0e14"/>
    </linearGradient>
    <linearGradient id="selected" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#303c4f"/>
      <stop offset="1" stop-color="#252f3d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .label { fill: #9aa5b6; font-size: 18px; }
      .body { fill: #e3e9f2; font-size: 20px; }
      .small { fill: #9aa5b6; font-size: 16px; }
      .title { fill: #e3e9f2; font-size: 21px; font-weight: 700; }
      .column { fill: #e3e9f2; font-size: 18px; font-weight: 700; letter-spacing: 1.5px; }
    </style>
  </defs>

  <rect width="1440" height="820" rx="34" fill="#07090d"/>
  <rect x="32" y="32" width="1376" height="756" rx="22" fill="url(#shell)" stroke="#253043" stroke-width="2" filter="url(#shadow)"/>

  <rect x="32" y="32" width="1376" height="58" rx="22" fill="#171d27"/>
  <rect x="32" y="67" width="1376" height="23" fill="#171d27"/>
  <circle cx="70" cy="61" r="8" fill="#ff7b54"/>
  <circle cx="98" cy="61" r="8" fill="#ffb020"/>
  <circle cx="126" cy="61" r="8" fill="#3fbf7f"/>
  <text x="720" y="68" text-anchor="middle" class="mono label">kb · local board</text>

  <rect x="54" y="112" width="5" height="32" rx="2" fill="#ff7b54"/>
  <text x="72" y="137" class="mono" fill="#ff7b54" font-size="27" font-weight="700">kb</text>
  <text x="112" y="137" class="mono body">/ Projects / personal</text>
  <rect x="1082" y="108" width="298" height="38" rx="9" fill="#171d27" stroke="#253043"/>
  <text x="1102" y="133" class="mono small">/ Filter cards</text>

  <rect x="54" y="166" width="192" height="36" rx="9" fill="#151c28" stroke="#4f8ef7"/>
  <text x="72" y="190" class="mono" fill="#7aa2f7" font-size="16" font-weight="700">project: personal</text>
  <rect x="258" y="166" width="108" height="36" rx="9" fill="#201b12" stroke="#ffb020"/>
  <text x="279" y="190" class="mono" fill="#ffb020" font-size="16" font-weight="700">#launch</text>

  <rect x="54" y="226" width="420" height="48" rx="9" fill="#26344b"/>
  <rect x="494" y="226" width="420" height="48" rx="9" fill="#252f3d"/>
  <rect x="934" y="226" width="446" height="48" rx="9" fill="#252f3d"/>
  <rect x="54" y="226" width="7" height="48" rx="3" fill="#7aa2f7"/>
  <rect x="494" y="226" width="7" height="48" rx="3" fill="#f2a33c"/>
  <rect x="934" y="226" width="7" height="48" rx="3" fill="#3fbf7f"/>
  <text x="78" y="257" class="mono column" fill="#7aa2f7">● 1  TODO</text>
  <text x="430" y="257" text-anchor="end" class="mono small">3</text>
  <text x="518" y="257" class="mono column" fill="#f2a33c">● 2  DOING</text>
  <text x="870" y="257" text-anchor="end" class="mono small">2</text>
  <text x="958" y="257" class="mono column" fill="#3fbf7f">● 3  DONE</text>
  <text x="1336" y="257" text-anchor="end" class="mono small">1</text>

  <g>
    <rect x="54" y="292" width="420" height="130" rx="12" fill="url(#selected)" stroke="#4f8ef7" stroke-width="2"/>
    <rect x="54" y="292" width="7" height="130" rx="3" fill="#4f8ef7"/>
    <text x="80" y="326" class="mono small" fill="#7aa2f7">#12</text>
    <text x="80" y="361" class="mono title">Write launch notes</text>
    <rect x="80" y="382" width="122" height="25" rx="7" fill="#3a2c10"/>
    <text x="92" y="400" class="mono" fill="#ffb020" font-size="14">#docs</text>
    <rect x="210" y="382" width="154" height="25" rx="7" fill="#271e39"/>
    <text x="222" y="400" class="mono" fill="#b98af7" font-size="14">project: personal</text>
    <text x="438" y="400" text-anchor="end" class="mono small">high</text>
  </g>

  <g>
    <rect x="54" y="438" width="420" height="112" rx="12" fill="#171d27" stroke="#253043"/>
    <text x="80" y="472" class="mono small" fill="#7aa2f7">#15</text>
    <text x="80" y="507" class="mono title">Review onboarding flow</text>
    <text x="80" y="532" class="mono small">□ install  □ first task  □ shortcuts</text>
  </g>

  <g>
    <rect x="54" y="566" width="420" height="98" rx="12" fill="#171d27" stroke="#253043"/>
    <text x="80" y="600" class="mono small" fill="#7aa2f7">#18</text>
    <text x="80" y="635" class="mono title">Connect the MCP client</text>
  </g>

  <g>
    <rect x="494" y="292" width="420" height="142" rx="12" fill="#252f3d" stroke="#3d4d63"/>
    <rect x="494" y="292" width="7" height="142" rx="3" fill="#4f8ef7"/>
    <text x="520" y="326" class="mono small" fill="#7aa2f7">#9</text>
    <text x="520" y="361" class="mono title">Polish the terminal board</text>
    <text x="520" y="392" class="mono small">☑ keyboard flow</text>
    <text x="520" y="416" class="mono small">□ verify mouse drag</text>
  </g>

  <g>
    <rect x="494" y="450" width="420" height="116" rx="12" fill="#171d27" stroke="#253043"/>
    <text x="520" y="484" class="mono small" fill="#7aa2f7">#14</text>
    <text x="520" y="519" class="mono title">Check forge import</text>
    <rect x="520" y="536" width="93" height="22" rx="6" fill="#142b22"/>
    <text x="531" y="552" class="mono" fill="#3fbf7f" font-size="13">github</text>
  </g>

  <g>
    <rect x="934" y="292" width="446" height="124" rx="12" fill="#171d27" stroke="#253043"/>
    <rect x="934" y="292" width="7" height="124" rx="3" fill="#3fbf7f"/>
    <text x="960" y="326" class="mono small" fill="#7aa2f7">#7</text>
    <text x="960" y="361" class="mono title">Ship the README</text>
    <text x="960" y="394" class="mono small">✓ copy  ✓ commands  ✓ links</text>
  </g>

  <line x1="54" y1="704" x2="1380" y2="704" stroke="#253043"/>
  <text x="60" y="744" class="mono small">
    <tspan fill="#e3e9f2">enter</tspan><tspan> open  </tspan>
    <tspan fill="#e3e9f2">space</tspan><tspan> lift/drop  </tspan>
    <tspan fill="#e3e9f2">n</tspan><tspan> new  </tspan>
    <tspan fill="#e3e9f2">/</tspan><tspan> filter  </tspan>
    <tspan fill="#e3e9f2">ctrl+k</tspan><tspan> commands</tspan>
  </text>
  <text x="1374" y="744" text-anchor="end" class="mono small">
    <tspan fill="#e3e9f2">?</tspan><tspan> help  </tspan>
    <tspan fill="#e3e9f2">q</tspan><tspan> quit</tspan>
  </text>
</svg>
